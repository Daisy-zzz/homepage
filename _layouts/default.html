<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#102d38">
  <title>{% if page.title and page.title != "Home" %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <link rel="icon" type="image/svg+xml" href="{{ '/assets/img/strand-mark.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  <script src="{{ '/assets/js/main.js' | relative_url }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="Zhizhen Zhang — Home">
        <img src="{{ '/assets/img/strand-mark.svg' | relative_url }}" width="34" height="34" alt="">
        <span>ZHIZHEN ZHANG<span class="brand-sub">RESEARCH / UQ</span></span>
      </a>
      <nav class="site-nav" aria-label="Primary navigation">
        {% for item in site.data.navigation.main %}
        <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}class="active" aria-current="page"{% endif %}>{{ item.title }}</a>
        {% endfor %}
        <a href="{{ '/' | relative_url }}#service">Service</a>
        <a href="mailto:{{ site.data.profile.email }}" class="contact-link">Contact <span aria-hidden="true">↗</span></a>
      </nav>
    </header>
    <main id="main">{{ content }}</main>
    <footer class="site-footer">
      <div><span class="footer-mark" aria-hidden="true">＋</span> {{ site.title }} <span class="footer-location"> / Brisbane, Australia</span></div>
      <div class="footer-links"><a href="{{ site.data.profile.scholar_url }}" target="_blank" rel="noopener noreferrer">Scholar ↗</a><a href="{{ site.data.profile.github_url }}" target="_blank" rel="noopener noreferrer">GitHub ↗</a><span>© {{ site.time | date: '%Y' }}</span><a href="#main" aria-label="Back to top">↑</a></div>
    </footer>
  </div>
</body>
</html>
